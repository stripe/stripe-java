name: Build
description: Check formatting and build the artifacts. Shared by CI and Canary CI; expects the repository to be checked out.

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Setup Java
      id: setup-jre
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        java-version: "17" # always use 17 LTS for building
        architecture: x64
        distribution: zulu

    - name: Set Test Java Runtime Environment variable
      shell: bash
      run: echo "JAVA_TEST_HOME=${JRE_PATH}" >> $GITHUB_ENV
      env:
        JRE_PATH: ${{ steps.setup-jre.outputs.path }}

    - name: Spotless
      shell: bash
      run: just format-check

    - name: Build artifacts
      shell: bash
      run: ./gradlew assemble javadoc
